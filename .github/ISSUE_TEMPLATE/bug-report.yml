name: Bug Report / Patch Issue
description: Something broke after patching; crash, bootloop, feature not working
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. Xiaomi Redmi Note 13, Vivo X200 Pro, OnePlus 15
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: e.g. 13, 14, 15
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: ROM / custom OS (if any)
      placeholder: e.g. stock, MIUI, HyperOS, LineageOS, PixelOS

  - type: input
    id: app
    attributes:
      label: Patched app/game
      placeholder: e.g. Half-Life 3, Spotify 8.9.98
    validations:
      required: true

  - type: checkboxes
    id: patches
    attributes:
      label: Patches applied
      description: Tick every patch you enabled for this build
      options:
        - label: Ads Free Rewards
        - label: No Ads
        - label: Block Push Ads
        - label: Skip Consent Popup
        - label: Skip Rate-Us Prompt
        - label: Spoof Play Store Install Source
        - label: Limit Ad Tracking
        - label: Disable Telemetry
        - label: Disable Crash Reporters
        - label: Bypass License Verification
        - label: Bypass Google Play Services Check
        - label: Pairip Bypass (Experimental)
        - label: Unlock RevenueCat Entitlements
        - label: Unlock All IAPs (Unity IAP)
        - label: Spoof Play Integrity
        - label: Disable Root Checks
        - label: Disable Update Checks
        - label: Remove Permissions
        - label: Remove Hardware Requirements
        - label: Unlock Rotation
        - label: Force Landscape / Portrait
        - label: Custom App Resolution (Experimental)
        - label: Allow Screenshots
        - label: Skip Splash Screen (Experimental)
        - label: Make App Debuggable
        - label: Change Version Code
        - label: Change Version Name
        - label: Rename App
        - label: Remove App Icon
        - label: Allow Cleartext Traffic
        - label: Keep Screen On
        - label: Remove Backup Restrictions
        - label: Export All Activities
        - label: Disable Battery Optimization Prompt
        - label: Remove Network Security Config
        - label: Enable Large Heap
        - label: Force Hardware Acceleration
        - label: Legacy External Storage
        - label: Keep Data on Uninstall
        - label: Set Install Location
        - label: Force Resizable Activity
        - label: Immersive Fullscreen
        - label: Strip Translations
        - label: Disable Vibration

  - type: textarea
    id: issue
    attributes:
      label: What happens?
      description: Description of the bug, crash log (if possible)
      placeholder: App crashes on launch.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The unpatched app/game works fine on this device
          required: true
        - label: I tested the latest version of Nai64Patches
